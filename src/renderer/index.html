<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>VELS Syndicate</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="booting">
  <div class="ambient" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
  <div class="titlebar"><div class="tb-title" id="tbTitle">VELS Syndicate</div></div>
  <div class="shell">
    <aside class="sidebar glass">
      <div class="brand">
        <div class="mark"><svg viewBox="0 0 32 32"><path d="M6 8l10 17L26 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="8" r="2.4" fill="currentColor"/></svg></div>
        <div><div class="brand-name">VELS</div><div class="brand-sub">Syndicate</div></div>
      </div>
      <nav id="nav"></nav>
      <div class="me" id="meCard"></div>
    </aside>
    <main id="main"></main>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="modal-host" id="modalHost"></div>
  <div class="toasts" id="toasts"></div>
  <div class="drop-hint" id="dropHint"><div>Drop on a computer to send</div></div>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
